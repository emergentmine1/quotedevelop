spring:
  application:
    name: kwe-quote-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?currentSchema=${DB_SCHEMA:quoteownr}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      leak-detection-threshold: 30000
      pool-name: kwe-quote-pool

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # metrics stays closed until authentication exists
        include: health,info
  endpoint:
    health:
      show-details: never

kwe:
  auth:
    # okta = validate Okta access tokens (production). static = dummy logins, local/dev only.
    mode: ${KWE_AUTH_MODE:okta}
    email-claims: ${KWE_AUTH_EMAIL_CLAIMS:email,sub}
    okta:
      issuer: ${OKTA_ISSUER:}
      audience: ${OKTA_AUDIENCE:api://default}
    static-login:
      jwt-secret: ${STATIC_JWT_SECRET:}
      password: ${STATIC_LOGIN_PASSWORD:}
      ttl-minutes: ${STATIC_JWT_TTL_MINUTES:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.kwe.quote: ${LOG_LEVEL:INFO}
