# Runs the Instant Quote stack against the shared development database.
#
# Before the first run:
#   cp backend-java/.env.example backend-java/.env    and fill it in
#   cd backend-java && ./mvnw clean package           the image copies the jar
#
# Then:
#   docker compose up -d --build
#   curl localhost:8080/ping
#
# The database is not part of this file. It is an existing AWS Aurora cluster
# and both the build and the running container connect to it.

services:
  backend:
    container_name: instantquote-backend
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./backend-java/.env
    restart: unless-stopped

  frontend:
    container_name: instantquote-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped
